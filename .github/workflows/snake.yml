name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Aaron-Bailey1202
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=a855f7&color_dots=%23020617,%230f172a,%231e40af,%233b82f6,%2393c5fd
            dist/github-contribution-grid-snake-dark.svg?color_snake=a855f7&color_dots=%23020617,%230f172a,%231e40af,%233b82f6,%2393c5fd
            
      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
