name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Aaron-Bailey1202
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=020617,0f172a,1e3a8a,2563eb,60a5fa&color_snake=a855f7
            dist/github-contribution-grid-snake-dark.svg?palette=020617,0f172a,1e3a8a,2563eb,60a5fa&color_snake=a855f7
            
      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
